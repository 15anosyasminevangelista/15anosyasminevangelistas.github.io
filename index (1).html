<title>Yasmin 15 anos | Convite</title>
<style>
:root{--gold:#e6c46a;--gold2:#f6e3a1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;background:#040a08;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center}
#app{position:relative;width:min(100vw,430px);height:100%;overflow:hidden;background:#06100c}
.st{position:absolute;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s}
.st.on{opacity:1;visibility:visible}
.bgb{position:absolute;inset:-12%;background:var(--i) center/cover;filter:blur(26px) brightness(.65) saturate(1.2)}
.pic{position:relative;width:min(100%,calc(100dvh*var(--r)));aspect-ratio:var(--r);background:var(--i) 0 0/100% 100%;box-shadow:0 0 40px #000c;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.035)}}
.zoom .pic{animation:zm 2s ease-in forwards}
@keyframes zm{to{transform:scale(1.35);filter:brightness(1.6)}}
.hs{position:absolute;display:block;border-radius:10px;-webkit-tap-highlight-color:transparent;transition:background .2s,box-shadow .2s}
.hs:hover,.hs:focus-visible,.hs:active{background:#e6c46a22;box-shadow:0 0 0 1px #e6c46a99,0 0 18px #e6c46a55;outline:0}
.seal{position:absolute;left:49.8%;top:54%;width:13%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 #f6e3a100,0 0 14px 2px #f6c85f55}50%{box-shadow:0 0 0 12px #f6e3a122,0 0 30px 8px #f6c85f99}}
.lg{position:absolute;left:50%;top:44%;width:60%;aspect-ratio:1.6;translate:-50% -50%;pointer-events:none;background:radial-gradient(ellipse,#ffe9a066,transparent 70%);mix-blend-mode:screen;animation:pl2 2.4s ease-in-out infinite alternate}
@keyframes pl2{to{opacity:.4;scale:1.15}}
.nav{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);translate:-50% 0;z-index:5;padding:11px 24px;border:1px solid var(--gold);border-radius:30px;background:#0a1a14d9;color:var(--gold2);font:600 13px/1 Georgia,serif;letter-spacing:.14em;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .8s .8s,visibility .8s .8s}
.nav.on{opacity:1;visibility:visible}
.nav:hover,.nav:focus-visible{background:#e6c46a33;outline:2px solid var(--gold2);outline-offset:3px}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#flash{position:absolute;inset:0;background:#fff8d8;opacity:0;pointer-events:none;transition:opacity .5s;z-index:9}.fl #flash{opacity:1}
button.st-btn{all:unset}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
